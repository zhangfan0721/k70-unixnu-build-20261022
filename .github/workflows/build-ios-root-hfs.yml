name: build-ios-root-hfs

# Build a real 16 GiB case-sensitive journaled HFS+ iOS root from the public
# iPhone X (D22AP) 16.7.16 IPSW, the way UniXNU-raphael does it.
#
# Why this matters: the 128 MiB hand-built image we used before held only two
# files and no attributes B-tree. Apple's HFS kext then took an undefined path
# and judged a UF_COMPRESSED-clear file as compressed, so execve returned
# ENOTSUP(45). A real root has tens of thousands of files and the full metadata.

on:
  workflow_dispatch:
    inputs:
      size:
        description: 'HFS+ volume size'
        required: false
        default: '16G'
      do_tweaks:
        description: 'Apply the SWEET bring-up tweaks'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Show resources
        run: |
          df -h /
          free -g
          nproc

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/graalvm /usr/share/swift /usr/local/.ghcup /opt/microsoft /usr/lib/R || true
          sudo apt-get clean
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            hfsprogs rsync unzip curl python3 python3-yaml \
            cmake libfuse3-dev libbz2-dev zlib1g-dev libicu-dev pkg-config \
            build-essential git
          sudo modprobe hfsplus
          grep hfsplus /proc/filesystems

      - name: Build apfs-fuse from source
        run: |
          git clone --depth 1 --recursive https://github.com/sgan81/apfs-fuse /tmp/apfs-src
          cd /tmp/apfs-src && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          sudo install -m 0755 apfs-fuse /usr/local/bin/apfs-fuse
          apfs-fuse 2>&1 | head -3 || true

      - name: Download the IPSW
        run: |
          set -euo pipefail
          IP=https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw
          mkdir -p dmg && cd dmg
          # The three root components are stored members of this IPSW. Guessing
          # HTTP byte ranges lands inside other members, so fetch the whole
          # archive and let unzip index it properly.
          curl -fL --retry 3 --progress-bar "$IP" -o restore.ipsw
          ls -l restore.ipsw
          unzip -l restore.ipsw | head -20
          unzip -l restore.ipsw | grep -E '087-86698-044|087-86593-047|087-86715-047'

      - name: Extract the three root components
        run: |
          set -euo pipefail
          cd dmg
          for m in 087-86698-044.dmg 087-86593-047.dmg 087-86715-047.dmg; do
            echo "=== $m ==="
            unzip -o -j restore.ipsw "$m" -d .
          done
          ls -lh *.dmg

      - name: Verify the members against BuildManifest
        run: |
          set -euo pipefail
          cd dmg
          unzip -o -j restore.ipsw BuildManifest.plist -d . >/dev/null
          python3 - <<'PY'
          import hashlib, plistlib, sys
          d = plistlib.load(open('BuildManifest.plist','rb'))
          want = {}
          for i in d.get('BuildIdentities', []):
              m = i.get('Manifest', {})
              for k in ('OS', 'Cryptex1,SystemOS', 'Cryptex1,AppOS'):
                  if k in m:
                      info = m[k]['Info']
                      want[info['Path']] = (m[k]['Digest'], info.get('HashMethod','sha2-384'))
          ok = True
          for path, (digest, method) in want.items():
              h = hashlib.sha384() if method == 'sha2-384' else hashlib.sha256()
              n = 0
              with open(path,'rb') as f:
                  while True:
                      b = f.read(1<<20)
                      if not b: break
                      h.update(b); n += len(b)
              good = h.digest() == digest
              print(f'{path:24s} {n:>12} bytes  {method}  {"OK" if good else "MISMATCH"}')
              ok = ok and good
          sys.exit(0 if ok else 1)
          PY

      - name: Build apfs-fuse (already built earlier) and mount
        run: |
          set -euxo pipefail
          cd dmg
          sudo mkdir -p /mnt/os /mnt/sysos /mnt/appos
          sudo apfs-fuse -o allow_other 087-86698-044.dmg /mnt/os || true
          sudo apfs-fuse -o allow_other 087-86593-047.dmg /mnt/sysos || true
          sudo apfs-fuse -o allow_other 087-86715-047.dmg /mnt/appos || true
          echo "--- /mnt/os ---";   sudo ls /mnt/os   | head -20 || true
          echo "--- /mnt/sysos ---"; sudo ls /mnt/sysos | head -20 || true
          echo "--- /mnt/appos ---"; sudo ls /mnt/appos | head -20 || true

      - name: Build the HFS+ root
        run: |
          set -euo pipefail
          SIZE="${{ inputs.size }}"
          dd if=/dev/zero of=ios16-root.img bs=1M count=0 seek=0 status=none || true
          truncate -s "$SIZE" ios16-root.img
          mkfs.hfsplus -v iOSRoot -b 4096 -J -c 2048 ios16-root.img || mkfs.hfsplus -v iOSRoot -b 4096 ios16-root.img
          sudo mkdir -p /mnt/root
          sudo mount -t hfsplus -o loop,force ios16-root.img /mnt/root
          mount | grep /mnt/root
          df -h /mnt/root
          echo "=== 顶层内容 ==="
          ls /mnt/root

      - name: Copy the OS tree
        run: |
          set -euxo pipefail
          # /mnt/os holds the OS root (3.apfs mount point contents)
          SRC=/mnt/os
          if [ -d "$SRC/3.apfs" ]; then SRC="$SRC/3.apfs"; fi
          echo "source: $SRC"; ls "$SRC" | head
          sudo rsync -aH --info=stats2 "$SRC"/ /mnt/root/ || {
            echo "rsync failed, trying without hard links"; sudo rsync -a "$SRC"/ /mnt/root/;
          }
          df -h /mnt/root
          sudo ls /mnt/root | head -20

      - name: Sanity check the volume
        run: |
          set -euxo pipefail
          for p in sbin/launchd usr/lib/dyld System/Library/CoreServices/SystemVersion.plist; do
            if sudo test -e "/mnt/root/$p"; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          sudo ls /mnt/root/System/Library/Caches/com.apple.dyld 2>/dev/null | head -3 || true
          df -h /mnt/root

      - name: Unmount and verify
        run: |
          set -euxo pipefail
          sudo sync
          sudo umount /mnt/root || sudo umount -l /mnt/root || true
          fsck.hfsplus -f -y ios16-root.img || true
          fsck.hfsplus -f -n ios16-root.img && echo "FSCK_CLEAN"
          ls -lh ios16-root.img
          sha256sum ios16-root.img

      - name: Upload the raw image (split)
        run: |
          mkdir -p out
          split -b 1900M -d ios16-root.img out/root-part.
          ls -lh out
          sha256sum ios16-root.img > out/root.img.sha256
          ls out | wc -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-root-hfs
          path: out/*
          retention-days: 7

      - name: Summarise
        if: always()
        run: |
          echo "=== 结果 ==="
          ls -lh ios16-root.img 2>/dev/null || echo "image missing"
          df -h /
