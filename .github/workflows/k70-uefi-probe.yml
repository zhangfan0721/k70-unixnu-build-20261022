name: K70 UEFI hardware probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - uefi-probe/**
      - .github/workflows/k70-uefi-probe.yml

permissions:
  contents: read

concurrency:
  group: k70-uefi-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  UEFI_REF: da38b23cc7b3b3716cf7c72c42866bd73c978dd3
  DTB_REF: 4d1572a93d15f5596309c0687fdc85d20ebf2e24
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: da38b23cc7b3b3716cf7c72c42866bd73c978dd3
          path: uefi
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU-vermeer
          ref: 4d1572a93d15f5596309c0687fdc85d20ebf2e24
          path: dtb-source
          persist-credentials: false
          sparse-checkout: scripts/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record pinned inputs and verify the isolated package
        env:
          K70_UEFI_SOURCE: ${{ github.workspace }}/uefi
          K70_DTB: ${{ github.workspace }}/dtb-source/scripts/data/vermeer.dtb
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C uefi rev-parse HEAD)" = "$UEFI_REF"
          test "$(git -C dtb-source rev-parse HEAD)" = "$DTB_REF"
          git -C uefi diff --exit-code
          git -C uefi submodule status --recursive | tee evidence/submodules-before.txt
          if grep -E '^[+U-]' evidence/submodules-before.txt; then exit 1; fi
          python -m unittest discover -s integration/uefi-probe -p 'test_*.py' -v 2>&1 | tee evidence/tests.log
          python integration/uefi-probe/prepare.py --uefi uefi --dtb "$K70_DTB" > evidence/package.json
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/vermeerProbe.dsc evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/vermeerProbe.fdf evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Include/DXE.inc evidence/DXE.inc
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Include/APRIORI.inc evidence/APRIORI.inc
      - name: Install firmware build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm lld nasm uuid-dev mono-devel gcc-aarch64-linux-gnu device-tree-compiler
          python -m pip install -r uefi/pip-requirements.txt
          python -m pip freeze > evidence/python-packages.txt
          clang --version > evidence/clang.txt
          uname -a > evidence/host.txt
          cat /etc/os-release >> evidence/host.txt
      - name: Add and verify the stock display handoff node
        run: |
          set -euo pipefail
          tree=uefi/Resources/DTBs/vermeerProbe.dtb
          fdtput -c "$tree" /reserved-memory/splash_region
          fdtput -t s "$tree" /reserved-memory/splash_region label cont_splash_region
          fdtput -t x "$tree" /reserved-memory/splash_region reg 0 b8000000 0 2b00000
          test "$(fdtget -t x "$tree" /reserved-memory/splash_region reg)" = '0 b8000000 0 2b00000'
          sha256sum "$tree" > evidence/patched-dtb.sha256
      - name: Build the standalone UEFI probe firmware
        working-directory: uefi
        run: |
          set -euo pipefail
          git -C Mu_Basecore apply --check "$GITHUB_WORKSPACE/uefi/Resources/MuPatches/Gic-Spurious.patch"
          git -C Mu_Basecore apply "$GITHUB_WORKSPACE/uefi/Resources/MuPatches/Gic-Spurious.patch"
          sha256sum Resources/MuPatches/Gic-Spurious.patch > ../evidence/gic-patch.sha256
          python build_uefi.py -d vermeerProbe -r DEBUG -m 0 2>&1 | tee ../evidence/firmware-build.log
      - name: Repack and verify an empty-ramdisk Android boot image
        run: |
          set -euo pipefail
          mkdir -p output
          python uefi/tools/vermeer-zh/pack_boot.py \
            --fd uefi/Build/vermeerProbePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd \
            --uefi uefi --dtb uefi/Resources/DTBs/vermeerProbe.dtb \
            --out output/K70-UEFI-probe.img --report output/boot-image-report.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, os, sys
          sys.path.insert(0, str(Path('integration/uefi-probe').resolve()))
          from verify_fv import probe_pe
          root = Path('uefi/Build/vermeerProbePkg')
          apps = list(root.rglob('VermeerProbe.efi'))
          if not apps:
              raise SystemExit('The probe application was not built')
          records = []
          for app in apps:
              blob = app.read_bytes()
              pe = struct.unpack_from('<I', blob, 0x3c)[0]
              if blob[:2] != b'MZ' or blob[pe:pe+4] != b'PE\0\0':
                  raise SystemExit('Invalid PE probe application')
              if struct.unpack_from('<H', blob, pe+4)[0] != 0xaa64 or struct.unpack_from('<H', blob, pe+24+68)[0] != 10:
                  raise SystemExit('Probe must be an AArch64 EFI application')
              records.append({'path': str(app), 'sha256': hashlib.sha256(blob).hexdigest()})
          volumes = [p for p in root.rglob('*') if p.name.upper() == 'FVMAIN.FV']
          if len(volumes) != 1:
              raise SystemExit('Expected exactly one generated FVMAIN volume')
          embedded = probe_pe(volumes[0].read_bytes())
          embedded_sha = hashlib.sha256(embedded).hexdigest()
          if embedded_sha not in {record['sha256'] for record in records}:
              raise SystemExit('The probe PE inside FVMAIN differs from the built application')
          report = {'uefi_commit': os.environ['UEFI_REF'], 'dtb_commit': os.environ['DTB_REF'],
                    'integration_commit': os.environ['GITHUB_SHA'], 'probe_apps': records,
                    'probe_guid': '4E746B99-462F-4C10-8A77-C3F83E5D4F72',
                    'fvmain_sha256': hashlib.sha256(volumes[0].read_bytes()).hexdigest(),
                    'embedded_probe_pe_sha256': embedded_sha,
                    'hardware_tested': False, 'xnu_executed': False,
                    'ram_scope': 'firmware-exposed map, not full installed RAM'}
          Path('output/probe-report.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
          cp uefi/Build/vermeerProbePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd output/
          cp uefi/Resources/DTBs/vermeerProbe.dtb output/
          cp integration/uefi-probe/README.md output/README.md
          (cd output && sha256sum K70-UEFI-probe.img SILICIUM_UEFI.fd vermeerProbe.dtb *.json > SHA256SUMS)
          git -C uefi submodule status --recursive > evidence/submodules-after.txt
          cmp evidence/submodules-before.txt evidence/submodules-after.txt
          git -C uefi/Mu_Basecore diff --binary > evidence/basecore-build-patches.diff
          cat output/probe-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified probe candidate
        uses: actions/upload-artifact@v4
        with:
          name: k70-uefi-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k70-uefi-probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            uefi/Build/BUILDLOG*.*
            uefi/Build/vermeerProbePkg/**/*.txt
          if-no-files-found: warn
          retention-days: 30
