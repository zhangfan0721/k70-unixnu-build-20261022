name: K70 bounded counter progression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - xnu-counter-checkpoint/**
      - .github/workflows/k70-counter-checkpoint.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: k70-counter-checkpoint-${{ github.ref }}
  cancel-in-progress: false

env:
  UEFI_REF: da38b23cc7b3b3716cf7c72c42866bd73c978dd3
  DTB_REF: 4d1572a93d15f5596309c0687fdc85d20ebf2e24
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: da38b23cc7b3b3716cf7c72c42866bd73c978dd3
          path: uefi
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU-vermeer
          ref: 4d1572a93d15f5596309c0687fdc85d20ebf2e24
          path: dtb-source
          persist-credentials: false
          sparse-checkout: scripts/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the preserved source-built kernel
        run: |
          set -euo pipefail
          mkdir -p evidence
          python integration/tools/restore_pinned_kernel.py --output kernel-input | tee evidence/pinned-kernel-input.json
      - name: Record pinned inputs
        run: |
          set -euo pipefail
          mkdir -p evidence output
          test "$(git -C uefi rev-parse HEAD)" = "$UEFI_REF"
          test "$(git -C dtb-source rev-parse HEAD)" = "$DTB_REF"
          git -C uefi diff --exit-code
          git -C uefi submodule status --recursive | tee evidence/submodules-before.txt
          if grep -E '^[+U-]' evidence/submodules-before.txt; then exit 1; fi
          echo '5fcfc61aa8a2d9670b03e53127c93364a418c76d84d713b2c11aea69623a25a8  kernel-input/kernel.development.vermeer-build.macho' | sha256sum -c -
      - name: Install firmware and host-test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm lld nasm uuid-dev mono-devel gcc-aarch64-linux-gnu device-tree-compiler
          python -m pip install -r uefi/pip-requirements.txt
          python -m pip install -r integration/xnu-counter-checkpoint/requirements.txt
          python -m pip freeze > evidence/python-packages.txt
          clang --version > evidence/clang.txt
      - name: Test and generate the bounded counter progression
        env:
          K70_UEFI_SOURCE: ${{ github.workspace }}/uefi
          K70_DTB: ${{ github.workspace }}/dtb-source/scripts/data/vermeer.dtb
          K70_KERNEL: ${{ github.workspace }}/kernel-input/kernel.development.vermeer-build.macho
        run: |
          set -euo pipefail
          python -m unittest discover -s integration/uefi-probe -v 2>&1 | tee evidence/probe-tests.log
          python -m unittest discover -s integration/xnu-preflight -v 2>&1 | tee evidence/preflight-tests.log
          python -m unittest discover -s integration/xnu-handoff-probe -v 2>&1 | tee evidence/handoff-tests.log
          python -m unittest discover -s integration/xnu-entry-checkpoint -v 2>&1 | tee evidence/entry-tests.log
          python -m unittest discover -s integration/xnu-bootstrap-checkpoint -v 2>&1 | tee evidence/bootstrap-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-mmu-checkpoint -v 2>&1 | tee evidence/mmu-tests.log
          python -m unittest discover -s integration/tools -v 2>&1 | tee evidence/pinned-input-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-c-entry-checkpoint -v 2>&1 | tee evidence/c-entry-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-c-prologue-checkpoint -v 2>&1 | tee evidence/c-prologue-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-first-call-checkpoint -v 2>&1 | tee evidence/first-call-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-exception-checkpoint -v 2>&1 | tee evidence/exception-tests.log
          K70_QA_OUT="$GITHUB_WORKSPACE/evidence" python -m unittest discover -s integration/xnu-counter-checkpoint -v 2>&1 | tee evidence/counter-tests.log
          python integration/xnu-counter-checkpoint/prepare.py --uefi uefi --dtb "$K70_DTB" \
            --kernel "$K70_KERNEL" --payload output/payload.bin --blobs output/entry-blobs > evidence/entry-package.json
          cp evidence/entry-package.json output/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/vermeerProbe.dsc evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/vermeerProbe.fdf evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Include/DXE.inc evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Include/APRIORI.inc evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Library/MemoryMapLib/MemoryMapLib.c evidence/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/ExpectedPayload.h output/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/HandoffTemplates.h output/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/EntryBlobs.h output/
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/Entry.c evidence/generated-Entry.c
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/Preflight.c evidence/generated-Preflight.c
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/GuardCore.c evidence/generated-GuardCore.c
          cp uefi/Platforms/Xiaomi/vermeerProbePkg/Probe/EntryCore.c evidence/generated-EntryCore.c
      - name: Preserve the verified display handoff
        run: |
          set -euo pipefail
          tree=uefi/Resources/DTBs/vermeerProbe.dtb
          fdtput -c "$tree" /reserved-memory/splash_region
          fdtput -t s "$tree" /reserved-memory/splash_region label cont_splash_region
          fdtput -t x "$tree" /reserved-memory/splash_region reg 0 b8000000 0 2b00000
          test "$(fdtget -t x "$tree" /reserved-memory/splash_region reg)" = '0 b8000000 0 2b00000'
      - name: Build the bounded counter progression firmware
        working-directory: uefi
        run: |
          set -euo pipefail
          git -C Mu_Basecore apply --check "$GITHUB_WORKSPACE/uefi/Resources/MuPatches/Gic-Spurious.patch"
          git -C Mu_Basecore apply "$GITHUB_WORKSPACE/uefi/Resources/MuPatches/Gic-Spurious.patch"
          python build_uefi.py -d vermeerProbe -r DEBUG -m 0 2>&1 | tee ../evidence/firmware-build.log
      - name: Pack and prove the public zero-seed template
        run: |
          set -euo pipefail
          python integration/xnu-preflight/pack_boot.py \
            --fd uefi/Build/vermeerProbePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd \
            --uefi uefi --dtb uefi/Resources/DTBs/vermeerProbe.dtb --payload output/payload.bin \
            --out unextended.img --report output/base-image-report.json
          python integration/xnu-handoff-probe/seed_image.py template \
            --input unextended.img --out output/K70-XNU-counter-template.img \
            --report output/boot-image-report.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, os, sys
          sys.path.insert(0, str(Path('integration/uefi-probe').resolve()))
          from verify_fv import probe_pe
          template_path = Path('output/boot-image-report.json')
          template = json.loads(template_path.read_text())
          template['seed_envelope_format_mode'] = template['mode']
          template['mode'] = 'counter-progression-checkpoint-template'
          template_path.write_text(json.dumps(template, indent=2)+'\n')
          root = Path('uefi/Build/vermeerProbePkg')
          checkpoint = Path('output/entry-blobs/checkpoint.bin').read_bytes()
          transition = Path('output/entry-blobs/transition.bin').read_bytes()
          entry_proof = json.loads(Path('output/entry-blobs/proof.json').read_text())
          vector_patch = Path('output/entry-blobs/vector-patches.bin').read_bytes()
          code_patch = Path('output/entry-blobs/code-patches.bin').read_bytes()
          code_originals = Path('output/entry-blobs/code-originals.bin').read_bytes()
          apps = list(root.rglob('VermeerProbe.efi'))
          if not apps:
              raise SystemExit('Preflight application was not built')
          records = []
          for app in apps:
              blob = app.read_bytes()
              pe = struct.unpack_from('<I', blob, 0x3c)[0]
              if blob[:2] != b'MZ' or blob[pe:pe+4] != b'PE\0\0' or struct.unpack_from('<H', blob, pe+4)[0] != 0xaa64 or struct.unpack_from('<H', blob, pe+24+68)[0] != 10:
                  raise SystemExit('Not an AArch64 EFI application')
              if checkpoint not in blob or transition not in blob or bytes.fromhex(entry_proof['instrumented_mapped_sha256']) not in blob:
                  raise SystemExit('Built PE does not contain the reviewed entry blobs and mapped hash')
              if vector_patch not in blob or bytes.fromhex(entry_proof['original_prefix_sha256']) not in blob:
                  raise SystemExit('Original prefix hash or low vector patch missing from actual PE')
              if code_patch not in blob or code_originals not in blob or any(bytes.fromhex(entry_proof[k]) not in blob for k in ['original_first_callee_sha256', 'original_call_prefix_sha256', 'original_helper_sha256', 'original_arm_init_sha256', 'code_patch_sha256', 'stub_sha256', 'transition_sha256']):
                  raise SystemExit('MMU patch or independently verified diagnostic/helper hashes missing from actual PE')
              if entry_proof['code_pages'] != [0x8803f9000,0x8803fb000,0x881604000,0x8803fa000,0x8803ff000,0x881608000,0x8809e5000,0x8803f2000] or not entry_proof['bootstrap_map_contained']:
                  raise SystemExit('Unexpected MMU checkpoint ownership profile')
              if entry_proof['code_patch_offsets'] != [0x3f7290,0x3f733c,0x9e1e80] or not entry_proof['original_common_cold_tail_preserved'] or not entry_proof['original_arm_init_body_executed']:
                  raise SystemExit('Wrong original C-entry interception profile')
              if entry_proof['original_arm_init_prologue_bytes'] != 60 or entry_proof['guard_global_value'] != 0 or not entry_proof['first_original_call_executed']:
                  raise SystemExit('Wrong bounded C-prologue profile')
              if entry_proof['original_first_callee_bytes'] != 4 or entry_proof['header_flags'] != 0x200001 or entry_proof['tbi_configuration_executed'] or entry_proof['relocation_branch_executed'] or entry_proof['relocation_writes_executed']:
                  raise SystemExit('Wrong first-call/header boundary')
              if not entry_proof['counter_read_only'] or entry_proof['controlled_brk_probe'] or entry_proof['eret_or_resume_executed'] or entry_proof['timer_irq_executed'] or entry_proof['timer_control_programmed'] or entry_proof['gic_programmed']:
                  raise SystemExit('Wrong read-only counter scope')
              if entry_proof['record_schema'] != 'counter-three-sample-v1' or entry_proof['sample_count_per_counter'] != 3 or entry_proof['delay_loop_rounds'] != [4096,8192] or entry_proof['frequency_upper_bound_hz'] != 1000000000 or entry_proof['record_at_failure_policy'] != 'halt_mci_on':
                  raise SystemExit('Wrong bounded counter profile')
              if len(entry_proof['counter_mrs']) != 8:
                  raise SystemExit('Wrong counter read count')
              for read in entry_proof['counter_mrs']:
                  off=entry_proof['checkpoint_symbols'][read['label']]
                  opcode={'CNTFRQ_EL0':0xd53be009,'CNTPCT_EL0':0xd53be029,'CNTVCT_EL0':0xd53be049}[read['register']]
                  if read['offset'] != off or read['opcode'] != opcode or checkpoint[off:off+4] != struct.pack('<I',opcode) or checkpoint[off-4:off] != struct.pack('<I',0xd5033fdf):
                      raise SystemExit('Actual counter MRS/barrier differs')
              records.append({'path': str(app), 'sha256': hashlib.sha256(blob).hexdigest()})
          volumes = [p for p in root.rglob('*') if p.name.upper() == 'FVMAIN.FV']
          if len(volumes) != 1:
              raise SystemExit('Expected one FVMAIN')
          embedded_sha = hashlib.sha256(probe_pe(volumes[0].read_bytes())).hexdigest()
          if any(record['sha256'] != embedded_sha for record in records):
              raise SystemExit('Embedded app and built copies differ')
          if list(root.rglob('*VermeerBootMemoryDxe*')) or not list(root.rglob('*CapsuleRuntimeDxe')):
              raise SystemExit('Required bounded firmware profile was not retained')
          report = {'uefi_commit': os.environ['UEFI_REF'], 'dtb_commit': os.environ['DTB_REF'],
                    'integration_commit': os.environ['GITHUB_SHA'], 'probe_apps': records,
                    'probe_guid': '4E746B99-462F-4C10-8A77-C3F83E5D4F72',
                    'fvmain_sha256': hashlib.sha256(volumes[0].read_bytes()).hexdigest(),
                    'embedded_probe_pe_sha256': embedded_sha, 'mode': 'counter-progression-checkpoint',
                    'entry_proof': entry_proof, 'original_cpu_init_completed': False,
                    'original_common_start_instrumented': True,
                    'original_arm_init_prologue_executed': True,
                    'first_original_call_executed': True,
                    'original_arm_init_body_executed': True,
                    'tbi_configuration_executed': False,
                    'relocation_branch_executed': False,
                    'relocation_writes_executed': False,
                    'full_xnu_or_ios_booted': False,
                    'controlled_brk_probe': False,
                    'counter_read_only': True,
                    'frequency_absolute_calibration_verified': False,
                    'expected_exception_capture': False,
                    'eret_or_resume_executed': False,
                    'exception_delivery_hardware_verified': False,
                    'timer_counter_hardware_verified': False,
                    'timer_irq_hardware_verified': False,
                    'hardware_tested': False, 'xnu_executed': False, 'original_cpu_init_executed': False,
                    'boot_args_built': False,
                    'boot_args_template_built': True, 'private_seed_required': True}
          Path('output/probe-report.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
          cp uefi/Build/vermeerProbePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd output/
          cp uefi/Resources/DTBs/vermeerProbe.dtb output/
          cp integration/xnu-counter-checkpoint/README.md output/
          (cd output && sha256sum K70-XNU-counter-template.img payload.bin SILICIUM_UEFI.fd vermeerProbe.dtb *.h *.json entry-blobs/* > SHA256SUMS)
          git -C uefi submodule status --recursive > evidence/submodules-after.txt
          cmp evidence/submodules-before.txt evidence/submodules-after.txt
          git -C uefi/Mu_Basecore diff --binary > evidence/basecore-build-patches.diff
          cat output/probe-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified template - private seed required before boot
        uses: actions/upload-artifact@v4
        with:
          name: k70-counter-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k70-counter-checkpoint-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            uefi/Build/BUILDLOG*.*
            uefi/Build/vermeerProbePkg/**/*.txt
          if-no-files-found: warn
          retention-days: 30
